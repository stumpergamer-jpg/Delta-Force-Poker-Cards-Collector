<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Cartes Ahsarah - Delta Force</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            margin: 0;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
        }

        .subtitle {
            color: var(--text-muted);
            margin: 4px 0 0 0;
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-counter {
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-counter strong {
            color: var(--accent-blue);
        }

        .btn-paypal {
            background-color: #0070ba;
            color: #ffffff;
            border: 1px solid #005ea6;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-paypal:hover {
            background-color: #005ea6;
            transform: translateY(-1px);
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .lang-selector label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .lang-selector select {
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .lang-selector select:hover {
            border-color: var(--accent-blue);
        }

        /* --- DASHBOARD --- */
        .dashboard {
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green {
            background-color: #22c55e;
        }

        .dot.red {
            background-color: #ef4444;
        }

        .progress-bar-bg {
            background-color: #0f172a;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            width: 0%;
            transition: width 0.3s ease-in-out;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-filter {
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-filter:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-filter.active {
            background-color: var(--accent-blue);
            color: #0b0f19;
            border-color: var(--accent-blue);
        }

        .btn-reset {
            margin-left: auto;
            background-color: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background-color: #ef4444;
            border-color: #f87171;
            color: #ffffff;
        }

        /* --- GRILLE DE CARTES --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1100px;
        }

        .card-item {
            background-color: var(--panel-bg);
            border: 2px solid var(--rarity-color, #475569);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
        }

        .card-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6), 0 0 12px var(--rarity-color, rgba(255, 255, 255, 0.2));
        }

        /* Possédée : transparence élevée */
        .card-item.owned {
            opacity: 0.35;
        }

        .card-item.owned:hover {
            opacity: 0.75;
        }

        .card-img-wrapper {
            width: 100px;
            height: 140px;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .card-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-top: 2px;
            font-weight: 600;
        }

        .card-item.owned .card-status {
            color: #22c55e;
        }

        .card-item:not(.owned) .card-status {
            color: #ef4444;
        }
    </style>
</head>

                <label for="langSelect" id="txt-lang-label">Langue :</label>

                    <option value="fr">Français</option>
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ru">Русский</option>
                </select>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <!-- Barre de complétion -->
        <div class="progress-section">
            <div class="progress-stats">
                <span class="stat-badge"><span class="dot green"></span> <span id="txt-owned-lbl">Possédées</span> :
                    <strong id="ownedCount">0</strong></span>
                <span class="stat-badge"><span class="dot red"></span> <span id="txt-missing-lbl">Manquantes</span> :
                    <strong id="missingCount">0</strong></span>
                <span><span id="txt-total-lbl">Total</span> : <strong id="totalCount">55</strong></span>
                <span style="color: var(--accent-blue); font-size: 1.1rem;" id="percentageText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Filtres par Rareté -->
        <div class="filter-group">
            <div class="filter-label" id="txt-filter-rarity">Filtrer par rareté :</div>
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="setRarityFilter('all', this)" id="btn-rarity-all">Toutes</button>
                <button class="btn-filter" onclick="setRarityFilter('red', this)" id="btn-rarity-red">🔴 Ultime</button>
                <button class="btn-filter" onclick="setRarityFilter('orange', this)" id="btn-rarity-orange">🟠 Légendaire</button>
                <button class="btn-filter" onclick="setRarityFilter('purple', this)" id="btn-rarity-purple">🟣 Épique</button>
                <button class="btn-filter" onclick="setRarityFilter('blue', this)" id="btn-rarity-blue">🔵 Rare</button>
                <button class="btn-filter" onclick="setRarityFilter('green', this)" id="btn-rarity-green">🟢 Inhabituel</button>
            </div>
        </div>

        <!-- Filtres par Enseigne -->
        <div class="filter-group">
            <div class="filter-label" id="txt-filter-type">Filtrer par couleur / type :</div>
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="setSuitFilter('all', this)" id="btn-suit-all">Toutes</button>
                <button class="btn-filter" onclick="setSuitFilter('Pique', this)" id="btn-suit-spade">♠ Pique</button>
                <button class="btn-filter" onclick="setSuitFilter('Coeur', this)" id="btn-suit-heart">♥ Cœur</button>
                <button class="btn-filter" onclick="setSuitFilter('Trèfle', this)" id="btn-suit-club">♣ Trèfle</button>
                <button class="btn-filter" onclick="setSuitFilter('Carreau', this)" id="btn-suit-diamond">♦ Carreau</button>
                <button class="btn-filter" onclick="setSuitFilter('Special', this)" id="btn-suit-special">★ Spéciales</button>
            </div>
        </div>

        <!-- Filtres par Statut & Reset -->
        <div class="filter-group" style="flex-direction: row; align-items: center; flex-wrap: wrap;">
            <div>
                <div class="filter-label" style="margin-bottom: 8px;" id="txt-filter-status">Affichage :</div>
                <div class="filter-buttons">
                    <button class="btn-filter active" onclick="setStatusFilter('all', this)" id="btn-status-all">Toutes</button>
                    <button class="btn-filter" onclick="setStatusFilter('owned', this)" id="btn-status-owned">Possédées</button>
                    <button class="btn-filter" onclick="setStatusFilter('missing', this)" id="btn-status-missing">Manquantes</button>
                </div>
            </div>
            <button class="btn-reset" onclick="resetCollection()" id="btn-reset">Réinitialiser la collection</button>
        </div>
    </div>

    <!-- Grille des cartes -->
    <div class="grid" id="cardsGrid"></div>
